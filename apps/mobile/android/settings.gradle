pluginManagement {
    def rnGradlePluginDir = new File(settingsDir, '../node_modules/@react-native/gradle-plugin')
    if (!rnGradlePluginDir.exists()) {
        rnGradlePluginDir = new File(settingsDir, '../../../node_modules/@react-native/gradle-plugin')
    }
    includeBuild(rnGradlePluginDir.canonicalPath)
}
plugins { id("com.facebook.react.settings") }

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    def command = [
      'node',
      '--no-warnings',
      '--eval',
      'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
      'react-native-config',
      '--json',
      '--platform',
      'android'
    ].toList()
    ex.autolinkLibrariesFromCommand(command)
  }
}

rootProject.name = 'MessyNotes'

def resolveStaticModuleDir = { String pkg ->
  def localDir = new File(settingsDir, "../node_modules/${pkg}")
  localDir.exists() ? localDir : new File(settingsDir, "../../../node_modules/${pkg}")
}

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(resolveStaticModuleDir('react-native'), 'gradle/libs.versions.toml')))
    }
  }
}

apply from: new File(resolveStaticModuleDir('expo'), 'scripts/autolinking.gradle');
useExpoModules()

include ':app'
includeBuild(resolveStaticModuleDir('@react-native/gradle-plugin'))

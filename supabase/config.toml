# Messy Notes — Supabase Local CLI Configuration
project_id = "messy-notes"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[auth]
enabled = true
site_url = "https://messy-notes-one.vercel.app"
additional_redirect_urls = ["https://messy-notes-one.vercel.app/", "http://localhost:5173", "messynotes://auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

name: Build Android Release APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Create Environment File
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const fs = require("node:fs");
            const clean = (v) => (v || "").replace(/[\r\n\t\s]+/g, "").replace(/^[\x22\x27]+|[\x22\x27]+$/g, "");
            const url = clean(process.env.EXPO_PUBLIC_SUPABASE_URL).replace(/\/+$/, "");
            const key = clean(process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY);
            if (!/^https?:\/\/.+/.test(url) || !key) {
              console.error("::error::Missing or invalid EXPO_PUBLIC_SUPABASE_URL or EXPO_PUBLIC_SUPABASE_ANON_KEY repository secrets. Configure both in GitHub Settings -> Secrets and variables -> Actions.");
              process.exit(1);
            }
            fs.writeFileSync("apps/mobile/.env", `EXPO_PUBLIC_SUPABASE_URL=${url}\nEXPO_PUBLIC_SUPABASE_ANON_KEY=${key}\n`);
          '

      - name: Build Android Release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          set -a
          . ../.env
          set +a
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Clean Up CI Environment File
        if: always()
        working-directory: apps/mobile
        run: rm -f .env

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/MessyNotes.apk
          if-no-files-found: error
